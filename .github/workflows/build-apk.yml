name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate release keystore and passwords
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 is empty or unavailable"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::KEYSTORE_PASSWORD is empty or unavailable"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::KEY_ALIAS is empty or unavailable"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::KEY_PASSWORD is empty or unavailable"; exit 1; }
          STORE_FILE="$RUNNER_TEMP/release-keystore.jks"
          CSR_FILE="$RUNNER_TEMP/keystore-check.csr"
          trap 'rm -f "$STORE_FILE" "$CSR_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
          test -s "$STORE_FILE" || { echo "::error::Decoded keystore file is empty"; exit 1; }
          keytool -list -keystore "$STORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          keytool -certreq -keystore "$STORE_FILE" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -file "$CSR_FILE" >/dev/null
          echo "Keystore file, store password, alias, and private-key password validated successfully."
          
      - name: Install dependencies
        run: npm install

      - name: Install native report plugins
        run: |
          npm install @capacitor/share@latest-6
          npm install @capacitor/filesystem@latest-6
          npm install @bcyesil/capacitor-plugin-printer@0.0.5

      - name: Add Android
        run: npx cap add android

      - name: Add native JSON save plugin
        run: |
          mkdir -p android/app/src/main/java/com/example/sccmix
          cat > android/app/src/main/java/com/example/sccmix/SaveFilePlugin.java <<'JAVA'
          package com.example.sccmix;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "SaveFile")
          public class SaveFilePlugin extends Plugin {
              @PluginMethod
              public void saveJson(PluginCall call) {
                  String fileName = call.getString("fileName", "SCC-Project.json");
                  String content = call.getString("content", null);
                  if (content == null) { call.reject("محتوای فایل ارسال نشده است"); return; }
                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("application/json");
                  intent.putExtra(Intent.EXTRA_TITLE, fileName);
                  startActivityForResult(call, intent, "handleCreateDocumentResult");
              }

              @ActivityCallback
              private void handleCreateDocumentResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  if (result == null || result.getResultCode() != Activity.RESULT_OK || result.getData() == null) {
                      call.reject("ذخیره‌سازی لغو شد"); return;
                  }
                  Uri uri = result.getData().getData();
                  if (uri == null) { call.reject("مسیر فایل انتخاب نشد"); return; }
                  String content = call.getString("content", null);
                  if (content == null) { call.reject("محتوای فایل در دسترس نیست"); return; }
                  try (OutputStream output = getContext().getContentResolver().openOutputStream(uri, "w")) {
                      if (output == null) throw new Exception("امکان باز کردن فایل وجود ندارد");
                      output.write(content.getBytes(StandardCharsets.UTF_8));
                      output.flush();
                      JSObject ret = new JSObject();
                      ret.put("uri", uri.toString());
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("نوشتن فایل ناموفق بود: " + e.getMessage(), e);
                  }
              }
          }
          JAVA
          cat > android/app/src/main/java/com/example/sccmix/MainActivity.java <<'JAVA'
          package com.example.sccmix;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SaveFilePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA


      - name: Add Poolakey billing bridge
        run: |
          sed -i '1i buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24" }\n}\n' android/build.gradle
          cat >> android/build.gradle <<'GRADLE'

          allprojects {
              repositories { maven { url 'https://jitpack.io' } }
          }
          GRADLE
          sed -i "/apply plugin: 'com.android.application'/a apply plugin: 'kotlin-android'" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          dependencies {
              implementation 'com.github.cafebazaar.Poolakey:poolakey:2.2.0'
          }
          android {
              kotlinOptions { jvmTarget = '17' }
          }
          GRADLE
          mkdir -p android/app/src/main/java/com/example/sccmix
          cat > android/app/src/main/java/com/example/sccmix/BazaarBillingPlugin.kt <<'KOTLIN'
          package com.example.sccmix
          import com.getcapacitor.JSObject
          import com.getcapacitor.Plugin
          import com.getcapacitor.PluginCall
          import com.getcapacitor.PluginMethod
          import com.getcapacitor.annotation.CapacitorPlugin
          import ir.cafebazaar.poolakey.Connection
          import ir.cafebazaar.poolakey.ConnectionState
          import ir.cafebazaar.poolakey.Payment
          import ir.cafebazaar.poolakey.config.PaymentConfiguration
          import ir.cafebazaar.poolakey.config.SecurityCheck
          import ir.cafebazaar.poolakey.entity.PurchaseState
          import ir.cafebazaar.poolakey.request.PurchaseRequest

          @CapacitorPlugin(name = "BazaarBilling")
          class BazaarBillingPlugin : Plugin() {
              companion object {
                  private const val RSA_PUBLIC_KEY = "YOUR_BAZAAR_RSA_PUBLIC_KEY"
                  private const val PRODUCT_ID = "YOUR_BAZAAR_PRODUCT_ID"
                  private const val PREFS = "scc_bazaar_entitlement"
                  private const val KEY_OWNED = "owned"
                  private const val KEY_CHECKED_AT = "checked_at"
                  private const val CHECK_INTERVAL = 24L * 60L * 60L * 1000L
              }
              private var payment: Payment? = null
              private var paymentConnection: Connection? = null
              private fun prefs() = context.getSharedPreferences(PREFS, android.content.Context.MODE_PRIVATE)
              private fun owned() = prefs().getBoolean(KEY_OWNED, false)
              private fun checkedAt() = prefs().getLong(KEY_CHECKED_AT, 0L)
              private fun configured() = !RSA_PUBLIC_KEY.startsWith("YOUR_") && !PRODUCT_ID.startsWith("YOUR_")
              private fun result(value: Boolean, verified: Boolean) = JSObject().apply {
                  put("owned", value); put("verified", verified); put("verifiedAt", checkedAt())
              }
              private fun save(value: Boolean) {
                  prefs().edit().putBoolean(KEY_OWNED, value).putLong(KEY_CHECKED_AT, System.currentTimeMillis()).apply()
              }
              private fun connect(ready: () -> Unit, failed: (Throwable) -> Unit) {
                  if (!configured()) { failed(IllegalStateException("شناسه محصول و کلید RSA هنوز تنظیم نشده‌اند")); return }
                  if (payment != null && paymentConnection?.getState() == ConnectionState.Connected) { ready(); return }
                  val p = payment ?: Payment(context, PaymentConfiguration(
                      localSecurityCheck = SecurityCheck.Enable(rsaPublicKey = RSA_PUBLIC_KEY)
                  )).also { payment = it }
                  paymentConnection = p.connect {
                      connectionSucceed { ready() }
                      connectionFailed { failed(it) }
                      disconnected { }
                  }
              }
              private fun verify(call: PluginCall, force: Boolean) {
                  if (!force && System.currentTimeMillis() - checkedAt() < CHECK_INTERVAL) {
                      call.resolve(result(owned(), false)); return
                  }
                  connect(ready = {
                      payment?.getPurchasedProducts {
                          querySucceed { items ->
                              val valid = items.any { it.productId == PRODUCT_ID && it.purchaseState == PurchaseState.PURCHASED }
                              save(valid); call.resolve(result(valid, true))
                          }
                          queryFailed { call.resolve(result(owned(), false)) }
                      }
                  }, failed = { call.resolve(result(owned(), false)) })
              }
              @PluginMethod fun getStatus(call: PluginCall) = verify(call, false)
              @PluginMethod fun restore(call: PluginCall) = verify(call, true)
              @PluginMethod fun purchase(call: PluginCall) {
                  connect(ready = {
                      payment?.purchaseProduct(
                          registry = activity.activityResultRegistry,
                          request = PurchaseRequest(productId = PRODUCT_ID, payload = "scc-mix-lifetime")
                      ) {
                          purchaseSucceed { save(true); call.resolve(result(true, true)) }
                          purchaseCanceled { call.reject("خرید توسط کاربر لغو شد") }
                          purchaseFailed { call.reject(it.message ?: "خرید ناموفق بود") }
                          failedToBeginFlow { call.reject(it.message ?: "شروع پرداخت ناموفق بود") }
                      }
                  }, failed = { error -> call.reject(error.message ?: "اتصال به کافه‌بازار برقرار نشد", error as? Exception ?: Exception(error)) })
              }
              override fun handleOnDestroy() {
                  paymentConnection?.disconnect(); paymentConnection = null
                  super.handleOnDestroy()
              }
          }
          KOTLIN
          cat > android/app/src/main/java/com/example/sccmix/MainActivity.java <<'JAVA'
          package com.example.sccmix;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SaveFilePlugin.class);
                  registerPlugin(BazaarBillingPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Generate Android assets
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: scc-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
