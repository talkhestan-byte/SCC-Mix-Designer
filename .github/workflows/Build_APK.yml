name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Install native report plugins
        run: |
          npm install @capacitor/share@latest-6
          npm install @capacitor/filesystem@latest-6
          npm install @bcyesil/capacitor-plugin-printer@0.0.5

      - name: Add Android
        run: npx cap add android

      - name: Add native JSON save plugin
        run: |
          mkdir -p android/app/src/main/java/com/example/sccmix
          cat > android/app/src/main/java/com/example/sccmix/SaveFilePlugin.java <<'JAVA'
          package com.example.sccmix;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import com.getcapacitor.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "SaveFile")
          public class SaveFilePlugin extends Plugin {
              @PluginMethod
              public void saveJson(PluginCall call) {
                  String fileName = call.getString("fileName", "SCC-Project.json");
                  String content = call.getString("content", null);
                  if (content == null) { call.reject("محتوای فایل ارسال نشده است"); return; }
                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("application/json");
                  intent.putExtra(Intent.EXTRA_TITLE, fileName);
                  startActivityForResult(call, intent, "handleCreateDocumentResult");
              }

              @ActivityCallback
              private void handleCreateDocumentResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  if (result == null || result.getResultCode() != Activity.RESULT_OK || result.getData() == null) {
                      call.reject("ذخیره‌سازی لغو شد"); return;
                  }
                  Uri uri = result.getData().getData();
                  if (uri == null) { call.reject("مسیر فایل انتخاب نشد"); return; }
                  String content = call.getString("content", null);
                  if (content == null) { call.reject("محتوای فایل در دسترس نیست"); return; }
                  try (OutputStream output = getContext().getContentResolver().openOutputStream(uri, "w")) {
                      if (output == null) throw new Exception("امکان باز کردن فایل وجود ندارد");
                      output.write(content.getBytes(StandardCharsets.UTF_8));
                      output.flush();
                      JSObject ret = new JSObject();
                      ret.put("uri", uri.toString());
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("نوشتن فایل ناموفق بود: " + e.getMessage(), e);
                  }
              }
          }
          JAVA
          cat > android/app/src/main/java/com/example/sccmix/MainActivity.java <<'JAVA'
          package com.example.sccmix;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SaveFilePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Generate Android assets
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: scc-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
