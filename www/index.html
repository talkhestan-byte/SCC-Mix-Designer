<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طراحی مخلوط بتن خودتراکم (SCC)</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header>
        <h1>طراحی مخلوط بتن خودتراکم</h1>
        <p>بر اساس فصل ۶ آیین‌نامه بتن ایران (آبا)</p>
    </header>

    <main>
        <form id="mixDesignForm">
            <!-- بخش ۱: مشخصات قطعه و مقاومت -->
            <section class="card">
                <h2>۱. مشخصات قطعه و مقاومت</h2>
                <div class="input-group">
                    <label for="fc">مقاومت مشخصه فشاری (MPa):</label>
                    <input type="number" id="fc" value="30" required min="15" max="50">
                </div>
                <div class="input-group">
                    <label for="stdDev">انحراف معیار (MPa):</label>
                    <input type="number" id="stdDev" value="5" required>
                </div>
                <div class="input-group">
                    <label for="rebarDensity">تراکم میلگرد:</label>
                    <select id="rebarDensity">
                        <option value="low">کم</option>
                        <option value="medium" selected>متوسط</option>
                        <option value="high">زیاد</option>
                        <option value="veryHigh">فوق‌العاده زیاد</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="maxAggSize">حداکثر اندازه اسمی سنگدانه (mm):</label>
                    <select id="maxAggSize">
                        <option value="9.5">9.5</option>
                        <option value="12.5">12.5</option>
                        <option value="19" selected>19</option>
                        <option value="25">25</option>
                    </select>
                </div>
            </section>

            <!-- بخش ۲: دانه‌بندی سنگدانه‌ها -->
            <section class="card">
                <h2>۲. دانه‌بندی سنگدانه‌ها</h2>
                <div class="input-group">
                    <label for="sandRatio">درصد شن به کل سنگدانه (S/A): <span id="sandRatioVal">50</span>%</label>
                    <input type="range" id="sandRatio" min="30" max="70" value="50" step="1">
                </div>
                <table class="grading-table">
                    <thead>
                        <tr><th>الک (mm)</th><th>عبوری ماسه (%)</th><th>عبوری شن (%)</th></tr>
                    </thead>
                    <tbody id="sieveTableBody"></tbody>
                </table>
            </section>

            <!-- بخش ۳: مشخصات مکانیکی و سیمان -->
            <section class="card">
                <h2>۳. مشخصات تکمیلی</h2>
                <div class="input-group">
                    <label for="voidsPercent">درصد فضای خالی سنگدانه:</label>
                    <input type="number" id="voidsPercent" value="35" required min="20" max="50">
                </div>
                <div class="input-group">
                    <label for="aggregateShape">شکل سنگدانه (Rs-a):</label>
                    <select id="aggregateShape">
                        <option value="1">۱ (گرد)</option>
                        <option value="2">۲</option>
                        <option value="3" selected>۳</option>
                        <option value="4">۴</option>
                        <option value="5">۵ (خیلی گوشه‌دار)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="sccType">نوع بتن خودتراکم:</label>
                    <select id="sccType">
                        <option value="powder" selected>پودری</option>
                        <option value="vma">دارای VMA</option>
                        <option value="combined">ترکیبی</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="cementType">رده مقاومتی سیمان:</label>
                    <select id="cementType">
                        <option value="325">325</option>
                        <option value="425" selected>425</option>
                        <option value="525">525</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="fracturePercent">درصد شکستگی شن:</label>
                    <select id="fracturePercent">
                        <option value="0">۰ درصد (گرد)</option>
                        <option value="100" selected>۱۰۰ درصد (شکسته)</option>
                    </select>
                </div>
            </section>

            <button type="submit" class="btn-calculate">محاسبه نهایی طرح مخلوط</button>
        </form>

        <!-- نمودار -->
        <section id="chartSection" class="card hidden">
            <h2>نمودار دانه‌بندی</h2>
            <div class="chart-container"><canvas id="gradingChart"></canvas></div>
            <p id="chartStatus" style="text-align:center; font-weight:bold; margin-top:10px;"></p>
        </section>

        <!-- خروجی نهایی -->
        <section id="results" class="card hidden">
            <h2>جدول نهایی طرح اختلاط</h2>
            <div id="outputData"></div>
        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
