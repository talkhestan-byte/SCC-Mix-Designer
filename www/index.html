<script>
const $ = id => document.getElementById(id);
const v = id => { const el = $(id); return el ? parseFloat(el.value) || 0 : 0; };
const f = (x, d = 1) => isFinite(x) ? (+x).toFixed(d) : '-';
const lin = (X, Y, x) => { let i = 0; while (i < X.length - 2 && x > X[i + 1]) i++; return Y[i] + (Y[i + 1] - Y[i]) * (x - X[i]) / (X[i + 1] - X[i]); };
const R = (l, h, t) => `<div class="r"><label>${l}</label>${h}${t ? `<button type="button" class="t" onclick="TB('${t}')">جدول</button>` : ''}</div>`;
const I = (id, val = '', extra = '') => `<input id="${id}" type="number" step="any" value="${val}" oninput="U(this)" ${extra}>`;
const S = (id, o, sel = 0) => `<select id="${id}" onchange="U(this)">${o.map((x, i) => `<option${i == sel ? ' selected' : ''}>${x}</option>`).join('')}</select>`;

const SVs = [["1½",38.1],["1",25],["¾",19],["½",12.5],["⅜",9.5],["4",4.75],["8",2.36],["16",1.18],["30",.6],["50",.3],["100",.15]];
const FMI = [0,2,4,5,6,7,8,9,10];
const N5 = [[.4,.3],[.35,.25],[.3,.2],[.25,.15],[.2,.1]];

const NP = [[573.91,-984.34,435.71,4.4767],[545.45,-894.81,369.48,13.818],[525.25,-817.75,313.6,22.121],[707.07,-1087.4,450.57,-5.6061],[545.45,-823.38,319.24,11.818],[505.05,-769.26,305.34,6.9242]];
const QP = [[0,43.589,-173.59,124.01],[0,80.04,-207,126.63],[0,119.86,-240.12,130.32],[0,123.42,-234.33,122.57],[0,126.73,-228.34,116.36],[0,107.59,-198.24,102.72]];
const CI = {'525': 0, '425': 2, '325': 4};
const ST = (c, x) => ((c[0] * x + c[1]) * x + c[2]) * x + c[3];

function wcOf(y, g, sh, pl) {
  const c = (pl ? QP : NP)[CI[g] + sh];
  let lo = .3, hi = .55;
  if (y >= ST(c, lo)) return lo;
  if (y <= ST(c, hi)) return hi;
  for (let i = 0; i < 40; i++) {
    const m = (lo + hi) / 2;
    ST(c, m) > y ? lo = m : hi = m;
  }
  return (lo + hi) / 2;
}

/* نسخه بهینه و سریع با ذخیره‌سازی */
const _fcmCache = new Map();
function fcmFromWcValue(wc, gr, sh, pl) {
  const key = wc.toFixed(3) + '_' + gr + '_' + sh + '_' + pl;
  if (_fcmCache.has(key)) return _fcmCache.get(key);
  let best = 10, bestD = 1e9;
  const c = (pl ? QP : NP)[CI[gr] + sh];
  // حل معکوس مستقیم: چون ST یک تابع درجه ۳ یکنواست، جستجوی دودویی روی y
  let lo = 10, hi = 70;
  for (let i = 0; i < 50; i++) {
    const mid = (lo + hi) / 2;
    const w = wcOf(mid, gr, sh, pl);
    if (w > wc) lo = mid; else hi = mid;
  }
  best = (lo + hi) / 2;
  _fcmCache.set(key, best);
  return best;
}

function SV() {
  const o = {};
  document.querySelectorAll('#mn input, #mn select, #mn textarea').forEach(e => { if (e.id) o[e.id] = e.value; });
  try { localStorage.setItem('scc_design_v4', JSON.stringify(o)); toast('طرح ذخیره شد'); } catch (e) { toast('ذخیره ناموفق'); }
  $('menu').hidden = true;
}
function sv(o) {
  for (const k in o) {
    const e = $(k);
    if (e) { e.value = o[k]; if (AU.includes(k)) e.dataset.m = 1; }
  }
}
function RS() {
  let s; try { s = localStorage.getItem('scc_design_v4'); } catch (e) {}
  $('menu').hidden = true;
  if (!s) return toast('طرحی ذخیره نشده');
  const o = JSON.parse(s);
  bd(); sv(o); calc(); toast('طرح بازیابی شد');
}
function PR() { $('menu').hidden = true; window.print(); }
function SH() {
  $('menu').hidden = true;
  const t = 'طرح مخلوط بتن خودتراکم\n' + ['o2','o3','o5','o7'].map(i => $(i) ? $(i).innerText : '').join('\n\n');
  if (navigator.share) navigator.share({ title: 'طرح SCC', text: t }).catch(() => {});
  else if (navigator.clipboard) { navigator.clipboard.writeText(t); toast('کپی شد'); }
  else toast('اشتراک‌گذاری پشتیبانی نمی‌شود');
}
const toast = m => { $('ts').textContent = m; $('ts').hidden = false; setTimeout(() => $('ts').hidden = true, 1600); };

/* جداول T و TB بدون تغییر */
// ... (بخش T و TB را همان‌طور که بود نگه دارید)

/* صفحه ۷ حذف می‌شود — پس PG فقط ۶ صفحه دارد */
const PG = [
// صفحات ۰ تا ۵ همان قبلی‌ها، اما بدون صفحه ۷
// ... 
];

let pg = 0;
$('mn').innerHTML = PG.map((h, i) => `<section id="p${i}">${h}</section>`).join('');

$('menuBtn').addEventListener('click', () => { $('menu').hidden = !$('menu').hidden; });

function go(i) {
  if (i < 0 || i >= PG.length) return;
  pg = i;
  PG.forEach((_, k) => $('p' + k).classList.toggle('on', k == i));
  $('pn').textContent = (i + 1) + ' / ' + PG.length;
  $('menu').hidden = true;
  $('btnPrev').disabled = (i == 0);
  $('btnNext').disabled = (i == PG.length - 1);
  scrollTo(0, 0);
  // بعد از نمایش، نمودار را با تأخیر کافی و اطمینان از عرض رسم کن
  if (i === 2) { requestAnimationFrame(() => requestAnimationFrame(() => ch())); }
  if (i === 3) { requestAnimationFrame(() => requestAnimationFrame(() => cw())); }
}

const AU = ['wcE', 'Wv', 'va', 'nl', 'nu', 'inc', 'kf', 'rcr', 'rc', 'spd', 'spr', 'ceq-kw'];
function U(e) {
  if (AU.includes(e.id)) e.dataset.m = 1;
  if (e.id === 'pl') {
    const plVal = $('pl').selectedIndex === 0;
    $('spd').disabled = !plVal;
    $('spr').disabled = !plVal;
    if (!plVal) { $('spd').value = 0; $('spr').value = 0; }
    else { if($('spd').value == 0) $('spd').value = 1; if($('spr').value == 0) $('spr').value = 1.08; }
  }
  if (/^(cr|tp|dn|ab)\d$|^r\d$|^g\d+_\d$/.test(e.id)) { if ($('Wv')) delete $('Wv').dataset.m; }
  if (e.id == 'na') bd();
  if (e.id == 'wcE' && $('wcR')) {
    $('wcR').value = e.value;
    guideLines = [{ x: v('wcE') }]; // ← به‌جای push، جایگزین کن
    cw();
  }
  calc();
}

/* اصلاح A: بدون تغییر مقدار کاربر، بدون toFixed روی undefined */
const A = (id, x, d) => {
  if (!$(id)) return;
  if ($(id).dataset.m) return; // کاربر تغییر داده، دست نزن
  if (!isFinite(x)) return;
  $(id).value = (+x).toFixed(d);
};

function bd() {
  const old = {};
  document.querySelectorAll('#gw input, #gw select').forEach(e => old[e.id] = e.value);
  const n = +$('na').value;
  const c = (id, d, x = '') => `<td><input id="${id}" type="number" step="any" value="${old[id] ?? d}" oninput="U(this)" ${x}></td>`;
  let h = '<table class="gt"><tr><th>الک</th>';
  for (let j = 1; j <= n; j++) h += `<th>سنگدانه ${j}</th>`;
  h += '<th>مخلوط</th><th>n پایین</th><th>n بالا</th></tr>';
  
  const row = (l, fn) => {
    h += `<tr><td>${l}</td>`;
    for (let j = 1; j <= n; j++) h += fn(j);
    h += '<td></td><td></td><td></td></tr>';
  };
  
  row('چگالی SSD', j => c('dn' + j, 2.6));
  row('جذب آب %', j => c('ab' + j, 2));
  row('نوع', j => {
    const o = old['tp' + j] ?? (j == n && n > 1 ? 'ماسه' : 'شن');
    return `<td><select id="tp${j}" onchange="U(this)">
      <option${o == 'شن' ? ' selected' : ''}>شن</option>
      <option${o == 'ماسه' ? ' selected' : ''}>ماسه</option>
      <option${o == 'پودرسنگ' ? ' selected' : ''}>پودرسنگ</option>
    </select></td>`;
  });
  row('شکستگی %', j => c('cr' + j, j == n && n > 1 ? 0 : 50));
  h += '<tr><td>نسبت %</td>';
  for (let j = 1; j <= n; j++) h += c('r' + j, 100 / n);
  h += '<td id="rsum"></td><td></td><td></td></tr>';
  
  SVs.forEach((s, i) => {
    h += `<tr><td>${s[0]}</td>`;
    for (let j = 1; j <= n; j++) h += c(`g${i}_${j}`, '');
    h += `<td id="m${i}"></td><td id="a${i}"></td><td id="b${i}"></td></tr>`;
  });
  $('gw').innerHTML = h + '</table>';
}

const PW = (d, D, n) => d >= D ? 100 : d <= .075 ? 0 : 100 * (d ** n - .075 ** n) / (D ** n - .075 ** n);
let MIX = [], WCP = { x: .5, y: 30, a: 0 };
let guideLines = [];

function calc() {
  if (!$('sm')) return;
  const m = $('sm').selectedIndex;
  const n = +$('na').value, D = v('D');
  $('g1').style.display = m == 0 ? 'block' : 'none';
  $('g2').style.display = m == 1 ? 'block' : 'none';
  $('g3').style.display = m == 2 ? 'block' : 'none';
  
  const fc = v('fc');
  const ci = fc <= 16 ? 0 : fc <= 20 ? 1 : fc <= 25 ? 2 : fc <= 35 ? 3 : 4;
  const SM = [7.5, 8.5, 9.5, 10.5, 11][ci];
  let o = '', fcm = 0;
  $('smv').textContent = SM;
  
  const fm = s => {
    const k = fc <= 20 ? 3 : 4, a = fc + 1.34 * s + 1.5, b = fc + 2.33 * s - k;
    fcm = Math.max(a, b);
    let t = `fcm = fc+1.34s+1.5 = ${f(a)}<br>fcm = fc+2.33s−${k} = ${f(b)}<br>max = ${f(fcm)}<br>`;
    if (fcm > fc + SM) { fcm = fc + SM; t += `⚠ بیش از fc+SM است؛ سقف اعمال شد: ${f(fc)}+${SM}<br>`; }
    return t + `<b>fcm = ${f(fcm)} MPa</b>`;
  };
  
  if (m == 0) {
    const s = [[2.5,3,3.5,4,4.5],[3.5,4,4.5,5,5.5],[4.5,5,5.5,6,6.5]][$('rk').selectedIndex][ci];
    $('sv').textContent = s;
    o += `رتبه ${$('rk').value}: s = ${s} (جدول ۳-۱)<br>` + fm(s);
  } else if (m == 1) {
    const a = $('dt').value.split(/[\s,;،]+/).map(parseFloat).filter(isFinite);
    const k = a.length, mu = a.reduce((x, y) => x + y, 0) / (k || 1);
    const sd = k > 1 ? Math.sqrt(a.reduce((x, y) => x + (y - mu) ** 2, 0) / (k - 1)) : 0;
    const Rf = k < 30 ? .75 + Math.sqrt(2 / (k || 1)) : 1;
    const s = Math.max(2.5, sd * Rf);
    o += `s = ${f(sd,2)} ؛ R = ${f(Rf,3)}<br>s اصلاح‌شده = ${f(s,2)}<br>` + fm(s);
  } else {
    fcm = fc + SM;
    o += `fcm = fc + SM = <b>${f(fcm)} MPa</b>`;
  }
  const fcm28 = fcm;
  $('o2').innerHTML = o;

  const rw = +$('rw').value - 1;
  A('nl', N5[rw][0], 2);
  A('nu', N5[rw][1], 2);
  
  const rs = [], dn = [], ac = [], tp = [], cr = [];
  let sum = 0, PGs = 0, PSs = 0, aG = 0, aS = 0;
  
  for (let j = 1; j <= n; j++) {
    rs[j] = v('r' + j); sum += rs[j];
    dn[j] = v('dn' + j); ac[j] = v('ab' + j) / 100;
    tp[j] = $('tp' + j) ? $('tp' + j).selectedIndex : 0;
    cr[j] = v('cr' + j);
  }
  
  for (let j = 1; j <= n; j++) {
    const p = rs[j] / (sum || 1);
    if (tp[j] == 0) { PGs += p; aG += p * cr[j]; }
    else if (tp[j] == 1) { PSs += p; aS += p * cr[j]; }
  }
  aG = PGs ? aG / PGs : 0;
  aS = PSs ? aS / PSs : 0;
  const ane = (PGs + PSs) ? (PGs * aG + 2 * PSs * aS) / (PGs + 2 * PSs) : 0;
  if ($('rsum')) $('rsum').textContent = f(sum, 0);

  MIX = SVs.map((sv, i) => {
    let x = 0;
    for (let j = 1; j <= n; j++) x += (rs[j] || 0) * v(`g${i}_${j}`);
    x /= sum || 1;
    if ($('m' + i)) $('m' + i).textContent = f(x);
    if ($('a' + i)) $('a' + i).textContent = f(PW(sv[1], D, v('nl')));
    if ($('b' + i)) $('b' + i).textContent = f(PW(sv[1], D, v('nu')));
    return isFinite(x) ? x : 0;
  });
  
  const FM = FMI.reduce((a, i) => a + 100 - MIX[i], 0) / 100;
  if ($('o3')) $('o3').innerHTML = `مدول نرمی مخلوط FM = ${f(FM, 2)}` + (Math.abs(sum - 100) > .01 ? '<br>⚠ مجموع نسبت‌ها ۱۰۰ نیست (نرمال می‌شود)' : '');
  
  // ← چک کن که cv واقعاً قابل رسم است
  if ($('cv') && $('cv').offsetWidth > 0) ch();

  /* w/c */
  const g = $('cg').value, pl = $('pl').selectedIndex == 0;
  const wR = wcOf(fcm28, g, 1, pl), wC = wcOf(fcm28, g, 0, pl);
  const wc0 = wR + (wC - wR) * aG / 100;
  
  A('wcR', wc0, 3);
  if (!$('wcE').dataset.m) $('wcE').value = f(wc0, 3);
  const wc = v('wcE') || wc0 || 0.45;
  
  WCP = { x: wc0, y: fcm28, a: aG };
  
  const fcmFromWc = fcmFromWcValue(wc, g, 0, pl);
  if ($('fcmE')) $('fcmE').value = f(fcmFromWc, 1);
  if ($('o5')) $('o5').innerHTML = `<b>w/c نهایی = ${f(wc, 3)}</b> ؛ مقاومت متناظر = ${f(fcmFromWc, 1)} MPa`;
  if ($('cw') && $('cw').offsetWidth > 0) cw();

  /* ====== صفحه ۵ ====== */
  const airMap = { 9.5: 2.25, 12.5: 1.875, 19: 1.5, 25: 1.125, 38: .75 };
  const Va = airMap[D] || 1.5;
  const rc = 3.15;
  const Wd = 170;
  const Cm = Wd / wc;
  
  if ($('ceq-wf')) $('ceq-wf').textContent = f(Wd, 2);
  if ($('ceq-wc')) $('ceq-wc').textContent = f(wc, 3);
  if ($('ceq-c')) $('ceq-c').textContent = f(Cm, 2);
  if ($('ceq-c-raw')) $('ceq-c-raw').textContent = f(Cm, 2);
  
  let finalW = Wd, finalC = Cm;
  
  if (Cm > 350) {
    const kw = v('ceq-kw') || 1.5;
    const addW = kw * (Cm - 350) / 10;
    const newW = Wd + addW;
    finalC = newW / wc;
    finalW = newW;
    if ($('ceq-c-new-num')) $('ceq-c-new-num').textContent = f(newW, 2);
    if ($('ceq-c-new-den')) $('ceq-c-new-den').textContent = f(wc, 3);
    if ($('ceq-c-new')) $('ceq-c-new').textContent = f(finalC, 2) + ' kg/m³';
    if ($('ceq-add-c')) $('ceq-add-c').textContent = f(finalC - Cm, 2);
    if ($('ceq-add-w')) $('ceq-add-w').textContent = f(addW, 2);
  } else {
    if ($('ceq-c-new-num')) $('ceq-c-new-num').textContent = f(Wd, 2);
    if ($('ceq-c-new-den')) $('ceq-c-new-den').textContent = f(wc, 3);
    if ($('ceq-c-new')) $('ceq-c-new').textContent = f(Cm, 2) + ' kg/m³';
    if ($('ceq-add-c')) $('ceq-add-c').textContent = "0.00";
    if ($('ceq-add-w')) $('ceq-add-w').textContent = "0.00";
  }
  
  const SP = finalC * (v('spd') / 100);
  const rsp = v('spr') || 1.08;
  
  const vC = finalC / (rc * 1000);
  const vSP = SP / (rsp * 1000);
  const vW = finalW / 1000;
  const vA = Va / 100;
  
  const Assd = 1 - (vC + vSP + vW + vA);
  
  if ($('eq-c')) $('eq-c').textContent = f(finalC, 2);
  if ($('eq-rc')) $('eq-rc').textContent = 3150;
  if ($('eq-cr')) $('eq-cr').textContent = "0.00";
  if ($('eq-rcr')) $('eq-rcr').textContent = 1000;
  if ($('eq-ma')) $('eq-ma').textContent = "0.00";
  if ($('eq-rma')) $('eq-rma').textContent = 1100;
  if ($('eq-sp')) $('eq-sp').textContent = f(SP, 2);
  if ($('eq-rsp')) $('eq-rsp').textContent = 1000;
  if ($('eq-w')) $('eq-w').textContent = f(finalW, 2);
  if ($('eq-rw')) $('eq-rw').textContent = 1000;
  if ($('eq-va')) $('eq-va').textContent = Va;
  if ($('eq-rva')) $('eq-rva').textContent = 100;
  
  const VA_total = Assd * 1000;
  let dry = 0, ab = 0;
  for (let j = 1; j <= n; j++) {
    const Vj = VA_total * (rs[j] || 0) / (sum || 1);
    const as = Vj * (dn[j] || 0);
    const d = as / (1 + (ac[j] || 0));
    dry += d; ab += as - d;
    
    if (j <= 2) {
      if ($('res-dn' + j)) $('res-dn' + j).textContent = f(dn[j], 2);
      if ($('res-ab' + j)) $('res-ab' + j).textContent = f(v('ab' + j), 1);
      if ($('res-cr' + j)) $('res-cr' + j).textContent = f(cr[j], 0);
      if ($('res-r' + j)) $('res-r' + j).textContent = f(rs[j] / (sum||1) * 100, 1);
      if ($('res-v' + j)) $('res-v' + j).textContent = f(Vj / 1000, 3);
      if ($('res-as' + j)) $('res-as' + j).textContent = f(as, 0);
      if ($('res-d' + j)) $('res-d' + j).textContent = f(d, 0);
    }
  }
  
  const totalWeight = dry + finalC + SP + finalW + ab;
  if ($('res-Ad')) $('res-Ad').textContent = `${f(dry, 0)} kg/m³`;
  if ($('res-Wt')) $('res-Wt').textContent = `${f(finalW + ab, 0)} kg/m³`;
  if ($('res-G')) $('res-G').textContent = `${f(totalWeight, 0)} kg/m³`;

  let t = `V_ASSD = ${f(Assd*1000,1)} dm³<br><hr>`;
  for (let j = 1; j <= n; j++) {
    const Vj = VA_total * (rs[j] || 0) / (sum || 1);
    const as = Vj * (dn[j] || 0);
    const d = as / (1 + (ac[j] || 0));
    t += `${['شن','ماسه','پودرسنگ'][tp[j]]} ${j}: حجم ${f(Vj,1)} L ؛ SSD ${f(as,0)} ؛ <b>خشک ${f(d,0)} kg</b><br>`;
  }
  t += `<hr>سنگدانه خشک کل: <b>${f(dry,0)}</b> kg<br>سیمان: <b>${f(finalC,0)}</b> kg<br>فوق‌روان‌کننده: <b>${f(SP,1)}</b> kg<br>آب آزاد: ${f(finalW,0)} kg ؛ <b>آب کل: ${f(finalW+ab,0)}</b> kg (جذب سنگدانه ${f(ab,0)})<br>w/c = ${f(finalW/finalC,3)}<br><b>وزن مخصوص محاسباتی = ${f(totalWeight,0)} kg/m³</b>`;
  if ($('o7')) $('o7').innerHTML = t;
}

/* ====== چ() اصلاح‌شده ====== */
function ch() {
  const c = $('cv'); 
  if (!c || !c.offsetWidth || !MIX.length) return;
  const dpr = window.devicePixelRatio || 2;
  const w = c.offsetWidth, h = 320;
  c.width = w * dpr; c.height = h * dpr; c.style.height = h + 'px';
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  
  const D = v('D') || 19;
  const mnLog = Math.log10(.075), mxLog = Math.log10(50);
  const x = d => 42 + (Math.log10(d) - mnLog) / (mxLog - mnLog) * (w - 52);
  const y = p => h - 32 - p * (h - 48) / 100;
  
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.font = '11px Tahoma,sans-serif'; g.fillStyle = '#333'; g.strokeStyle = '#e0e0e0'; g.lineWidth = 1;
  g.textAlign = 'right';
  
  for (let p = 0; p <= 100; p += 20) {
    g.beginPath(); g.moveTo(42, y(p)); g.lineTo(w - 10, y(p)); g.stroke();
    g.fillStyle = '#333'; g.fillText(p, 38, y(p) + 4);
  }
  
  g.save(); g.translate(14, h / 2); g.rotate(-Math.PI / 2); g.textAlign = 'center'; g.font = 'bold 11px Tahoma,sans-serif'; g.fillText('درصد عبوری (%)', 0, 0); g.restore();
  g.textAlign = 'center'; g.font = '11px Tahoma,sans-serif'; g.fillStyle = '#333';
  
  SVs.forEach(s => {
    const xx = x(s[1]);
    g.beginPath(); g.strokeStyle = '#ececec'; g.moveTo(xx, y(0)); g.lineTo(xx, y(100)); g.stroke();
    g.fillStyle = '#333'; g.fillText(s[0], xx, h - 14);
  });
  g.font = 'bold 11px Tahoma,sans-serif'; g.fillText('اندازه الک (mm)', w / 2, h - 2);
  
  const dStart = .15, dEnd = Math.min(D, 50);
  const L = (fn, col, lw) => {
    g.beginPath(); g.strokeStyle = col; g.lineWidth = lw;
    let a = true;
    for (let q = 0; q <= 160; q++) {
      const d = dStart * Math.pow(dEnd / dStart, q / 160);
      const p = fn(d);
      a ? g.moveTo(x(d), y(p)) : g.lineTo(x(d), y(p)); a = false;
    }
    g.stroke();
  };
  L(d => PW(d, D, v('nl') || 0.3), '#e00', 1.2);
  L(d => PW(d, D, v('nu') || 0.2), '#e00', 1.2);
  
  // ← اصلاح اصلی: ساخت نقاط فقط از SVs موجود
  const pts = [];
  for (let i = 0; i < SVs.length; i++) {
    const val = MIX[10 - i];
    if (isFinite(val)) pts.push({ x: x(SVs[i][1]), y: y(val), val: val, i: i });
  }
  pts.sort((a, b) => a.x - b.x);
  
  // ← رسم خط مخلوط: تا اولین نقطه با ۱۰۰٪، و صفر بعد از D
  g.beginPath(); g.strokeStyle = '#0645c8'; g.lineWidth = 2.5;
  let started = false, reached100 = false;
  for (let i = 0; i < pts.length; i++) {
    if (reached100 && pts[i].val > 0) continue; // بعد از ۱۰۰٪ صفر
    if (!started) { g.moveTo(pts[i].x, pts[i].y); started = true; }
    else g.lineTo(pts[i].x, pts[i].y);
    if (pts[i].val >= 99.99) reached100 = true;
  }
  g.stroke();
  
  // نقطه‌ها
  g.fillStyle = '#0645c8';
  reached100 = false;
  for (let i = 0; i < pts.length; i++) {
    if (reached100) break;
    g.beginPath(); g.arc(pts[i].x, pts[i].y, 3.5, 0, 7); g.fill();
    if (pts[i].val >= 99.99) reached100 = true;
  }
}

/* ====== cw اصلاح‌شده ====== */
function addGuideLine(wc) {
  if (wc >= .2 && wc <= .7) {
    guideLines = [{ x: wc }]; // ← جایگزین، نه push
    cw();
  }
}

function cw() {
  const c = $('cw'); 
  if (!c || !c.offsetWidth) return;
  const dpr = window.devicePixelRatio || 2;
  const w = c.offsetWidth, h = 360;
  c.width = w * dpr; c.height = h * dpr; c.style.height = h + 'px';
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  
  const L = 44, B = 34;
  const X = q => L + (q - .2) / .5 * (w - L - 14);
  const Y = q => h - B - (q - 10) / 60 * (h - B - 12);
  
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.font = '11px Tahoma,sans-serif'; g.fillStyle = '#333'; g.strokeStyle = '#e5e5e5'; g.lineWidth = 1;
  g.textAlign = 'right';
  
  for (let q = 10; q <= 70; q += 10) {
    g.beginPath(); g.moveTo(L, Y(q)); g.lineTo(w - 14, Y(q)); g.stroke();
    g.fillStyle = '#333'; g.fillText(q, 40, Y(q) + 4);
  }
  g.textAlign = 'center';
  
  for (let q = .2; q <= .7001; q += .05) {
    g.beginPath(); g.moveTo(X(q), Y(10)); g.lineTo(X(q), Y(70)); g.stroke();
    g.fillStyle = '#333'; g.fillText(q.toFixed(2), X(q), h - 14);
  }
  
  g.save(); g.translate(14, h / 2); g.rotate(-Math.PI / 2); g.textAlign = 'center'; g.font = 'bold 11px Tahoma,sans-serif'; g.fillText('fcm (MPa)', 0, 0); g.restore();
  g.font = 'bold 11px Tahoma,sans-serif'; g.fillText('w/c', w / 2, h - 2);
  
  const pl = $('pl') ? $('pl').selectedIndex == 0 : true;
  const idxs = [4, 5, 2, 3, 0, 1]; 
  const cols = ['#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b'];
  const labels = ['325C','325R','425C','425R','525C','525R'];

  idxs.forEach((idx, k) => {
    const yy = q => {
      const cc = (pl ? QP : NP)[idx];
      return ((cc[0] * q + cc[1]) * q + cc[2]) * q + cc[3];
    };
    
    g.beginPath(); g.strokeStyle = cols[k]; g.lineWidth = 1.5; g.setLineDash([6, 4]);
    let a = true;
    for (let q = .3; q <= .5501; q += .002) {
      const val = yy(q);
      if (!isFinite(val) || val < 10 || val > 70) continue;
      a ? g.moveTo(X(q), Y(val)) : g.lineTo(X(q), Y(val)); a = false;
    }
    g.stroke(); g.setLineDash([]);
    
    if (isFinite(yy(0.37))) {
      const lx = X(0.37 + (k % 3) * 0.04);
      const ly = Y(yy(0.37 + (k % 3) * 0.04)) - 5 - (Math.floor(k / 3) * 10);
      g.fillStyle = cols[k]; g.font = 'bold 10px Tahoma,sans-serif'; g.textAlign = 'left';
      g.fillText(labels[k], lx, ly);
    }
  });

  guideLines.forEach(gl => {
    if (gl.x >= .2 && gl.x <= .7) {
      const px = gl.x;
      const py = fcmFromWcValue(px, $('cg') ? $('cg').value : '425', 0, pl);
      if (!isFinite(py)) return;
      g.setLineDash([5, 4]); g.strokeStyle = '#000'; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(L, Y(py)); g.lineTo(X(px), Y(py)); g.lineTo(X(px), Y(10)); g.stroke();
      g.setLineDash([]);
      g.fillStyle = '#000'; g.beginPath(); g.arc(X(px), Y(py), 4, 0, 7); g.fill();
      g.font = 'bold 10px Tahoma,sans-serif'; g.textAlign = 'center';
      g.fillText(py.toFixed(1), L + 12, Y(py) - 6);
      g.fillText(px.toFixed(3), X(px) + 15, Y(10) - 6);
    }
  });
}

window.addEventListener('DOMContentLoaded', () => {
  bd();
  calc();
  // ← بلافاصله بعد از calc، نمودارها را با تأخیر دو rAF رسم کن
  requestAnimationFrame(() => requestAnimationFrame(() => { ch(); cw(); }));
  go(0);
});
window.addEventListener('resize', () => { ch(); cw(); });
