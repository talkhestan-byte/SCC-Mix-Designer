<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#123e59">
  <link rel="stylesheet" href="style.css">
  <title>طرح اختلاط بتن خودتراکم (SCC)</title>
  <!-- کتابخانه Chart.js برای رسم نمودار -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>طرح اختلاط بتن خودتراکم</h1>
    <p style="font-size: 12px; opacity: 0.8; margin-top: 5px;">بر اساس فصل ۶ آیین‌نامه بتن ایران (آبا)</p>
  </header>

  <main>
    <!-- نوار تب‌ها (گام‌ها) -->
    <nav id="tabs"></nav>
    
    <!-- محتوای هر گام -->
    <section id="screen"></section>
    
    <!-- دکمه‌های ناوبری -->
    <div class="actions">
      <button id="prev" type="button">گام قبل</button>
      <button id="next" type="button">گام بعد</button>
    </div>

    <!-- فوتر -->
    <footer style="text-align: center; padding: 15px 10px; margin-top: 20px; font-size: 12px; color: #475569; line-height: 1.5; border-top: 1px solid #e2e8f0;">
      <span style="direction: ltr; unicode-bidi: embed; display: inline-block;">talkhestan@gmail.com</span> 
      <span style="margin: 0 5px; color: #94a3b8;">|</span> 
      گردآورنده: مهدی پناهی تلخستانی
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
