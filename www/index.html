<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طرح مخلوط بتن خودتراکم</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px Tahoma,system-ui,sans-serif;background:#f4f5f7;color:#222;padding:0 0 60px}
header{position:sticky;top:0;z-index:5;background:#1f4e79;color:#fff;padding:env(safe-area-inset-top,0) 10px 0;display:flex;align-items:center;gap:10px;height:calc(46px + env(safe-area-inset-top,0px))}
header button{background:none;border:0;color:#fff;font-size:22px}
#menu{position:fixed;top:calc(46px + env(safe-area-inset-top,0px));right:8px;z-index:9;background:#fff;border:1px solid #bbb;border-radius:8px;box-shadow:0 2px 8px #0004}
#menu button{display:block;width:100%;padding:10px 18px;border:0;background:none;text-align:right;font-size:14px}
#menu button:active{background:#e8f1fb}
section{display:none;padding:8px}
section.on{display:block}
h3{margin:6px 2px;font-size:15px;color:#1f4e79}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:4px}
.r{display:flex;align-items:center;gap:6px;background:#fff;padding:6px;border-radius:6px}
.r label{flex:1;font-size:13px}
.r input,.r select{width:92px;padding:5px;font-size:13px}
.r input[readonly]{background:#eef2f7;color:#1f4e79;font-weight:bold}
.t{font-size:12px;padding:4px 7px;border:1px solid #1f4e79;background:#fff;color:#1f4e79;border-radius:5px}
.o{background:#e8f1fb;padding:8px;border-radius:6px;margin:6px 0;direction:ltr;text-align:left;line-height:1.7;font-size:13px}
.w{overflow-x:auto;background:#fff;border-radius:6px}
.gt{border-collapse:collapse;font-size:12px}
.gt td,.gt th{border:1px solid #ccc;padding:2px;text-align:center;white-space:nowrap}
.gt input{width:42px;padding:2px;font-size:12px}
.gt select{font-size:11px;padding:1px}
.gt td:first-child,.gt th:first-child{position:sticky;right:0;background:#dde8f5}
canvas{width:100%;background:#fff;border-radius:6px;display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;background:#fff;border-top:1px solid #ccc;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{padding:8px 16px;font-size:14px;border:0;background:#1f4e79;color:#fff;border-radius:6px}
nav button:disabled{background:#9bb3cc}
#md{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:center;justify-content:center}
#md>div{background:#fff;max-height:80%;overflow:auto;border-radius:8px;padding:10px;width:94%}
#ts{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:16px;z-index:30}
[hidden]{display:none!important}
.absv{direction:ltr;text-align:center;font-family:"Cambria Math",serif;font-size:15px;line-height:2.6;background:#fff;padding:12px;border-radius:8px;border:1px solid #cfd8e3}
.absv .fr{display:inline-block;vertical-align:middle;text-align:center;margin:0 2px}
.absv .fr .num{display:block;border-bottom:1.5px solid #333;padding:0 4px}
.absv .fr .den{display:block;padding:0 4px}
.absv .big{font-size:18px}
@media print{header,nav,#menu,.t{display:none!important}section{display:block!important}body{background:#fff}}
</style>
</head>

function ch(){

  g.textAlign='right';
  for(let p=0;p<=100;p+=20){
    g.beginPath();g.moveTo(42,y(p));g.lineTo(w-10,y(p));g.stroke();
    g.fillStyle='#333';g.fillText(p,38,y(p)+4)

    g.fillStyle='#333';g.fillText(s[0],xx,h-14)

  const maxDD=Math.min(D,50);
