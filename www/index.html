<style>

.gt input{width:42px;padding:2px;font-size:12px}.gt td:first-child,.gt th:first-child{position:sticky;right:0;background:#dde8f5}

#ts{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:16px;z-index:30}
