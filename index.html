<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طراحی مخلوط بتن خودتراکم (SCC)</title>
    <link rel="stylesheet" href="style.css">
    <!-- فونت وزیرمتن برای زیبایی -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
</head>
<body>

    <header>
        <h1>طراحی مخلوط بتن خودتراکم</h1>
        <p>بر اساس فصل ۶ آیین‌نامه بتن ایران (آبا)</p>
    </header>

    <main>
        <form id="mixDesignForm">
            <!-- بخش ۱: مشخصات پروژه و قطعه -->
            <section class="card">
                <h2>۱. مشخصات قطعه و مقاومت</h2>
                <div class="input-group">
                    <label for="fc">مقاومت مشخصه فشاری (MPa):</label>
                    <input type="number" id="fc" placeholder="مثلاً 30" required min="15" max="50">
                </div>
                <div class="input-group">
                    <label for="stdDev">انحراف معیار (MPa):</label>
                    <input type="number" id="stdDev" placeholder="مثلاً 5" required>
                </div>
                <div class="input-group">
                    <label for="elementType">نوع قطعه:</label>
                    <select id="elementType">
                        <option value="thin">نازک (دیوار/دال)</option>
                        <option value="thick">ضخیم (ستون/شالوده)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="rebarDensity">تراکم میلگرد:</label>
                    <select id="rebarDensity">
                        <option value="low">کم</option>
                        <option value="medium">متوسط</option>
                        <option value="high">زیاد</option>
                        <option value="veryHigh">فوق‌العاده زیاد</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="maxAggSize">حداکثر اندازه اسمی سنگدانه (mm):</label>
                    <select id="maxAggSize">
                        <option value="9.5">9.5</option>
                        <option value="12.5">12.5</option>
                        <option value="19">19</option>
                        <option value="25">25</option>
                    </select>
                </div>
            </section>

            <!-- بخش ۲: مشخصات مصالح -->
            <section class="card">
                <h2>۲. مشخصات مصالح</h2>
                <div class="input-group">
                    <label for="sccType">نوع بتن خودتراکم:</label>
                    <select id="sccType">
                        <option value="powder">پودری (فقط مواد پودری)</option>
                        <option value="vma">دارای افزودنی اصلاح‌کننده گرانروی (VMA)</option>
                        <option value="combined">ترکیبی (پودر + VMA)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="cementType">رده مقاومتی سیمان:</label>
                    <select id="cementType">
                        <option value="325">325</option>
                        <option value="425">425</option>
                        <option value="525">525</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="aggregateShape">شکل و گوشه‌داری سنگدانه (Rs-a):</label>
                    <select id="aggregateShape">
                        <option value="1">۱ (گرد و مناسب)</option>
                        <option value="2">۲ (نیمه گرد)</option>
                        <option value="3">۳ (نیمه گوشه‌دار)</option>
                        <option value="4">۴ (گوشه‌دار)</option>
                        <option value="5">۵ (خیلی گوشه‌دار)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="fracturePercent">درصد شکستگی سنگدانه درشت:</label>
                    <select id="fracturePercent">
                        <option value="0">۰ درصد (گرد - R)</option>
                        <option value="100">۱۰۰ درصد (شکسته - C)</option>
                    </select>
                </div>
            </section>

            <!-- بخش ۳: چگالی مواد -->
            <section class="card">
                <h2>۳. چگالی (وزن مخصوص) مواد</h2>
                <div class="input-group">
                    <label>چگالی سیمان (kg/m³):</label>
                    <input type="number" id="densCement" value="3150" required>
                </div>
                <div class="input-group">
                    <label>چگالی سنگدانه ریز (kg/m³):</label>
                    <input type="number" id="densFineAgg" value="2650" required>
                </div>
                <div class="input-group">
                    <label>چگالی سنگدانه درشت (kg/m³):</label>
                    <input type="number" id="densCoarseAgg" value="2700" required>
                </div>
            </section>

            <!-- دکمه محاسبه -->
            <button type="submit" class="btn-calculate">محاسبه طرح مخلوط</button>
        </form>

        <!-- بخش نمایش نتایج -->
        <section id="results" class="card hidden">
            <h2>خروجی طرح مخلوط</h2>
            <div id="outputData"></div>
            <button onclick="window.print()" class="btn-print">چاپ / ذخیره PDF</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
